<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Pust</title>
    <meta name="description" content="Pust - din egen app for pustestopp-trening (apnoe), med CO2- og O2-tabeller." />

    <meta name="theme-color" content="#0a0e13" />
    <meta name="color-scheme" content="dark" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pust" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <link rel="icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header" id="app-header" hidden>
        <button class="app-header__back" id="app-back" type="button" aria-label="Tilbake" hidden>←</button>
        <div class="app-header__title" id="app-title">Pust</div>
      </header>

      <main id="view-root" aria-live="polite"></main>

      <nav class="bottom-nav" id="bottom-nav" hidden>
        <button class="bottom-nav__item" data-route="#/tabeller" type="button">
          <span class="bottom-nav__icon" aria-hidden="true">🫧</span>
          <span>Hjem</span>
        </button>
        <button class="bottom-nav__item" data-route="#/historikk" type="button">
          <span class="bottom-nav__icon" aria-hidden="true">📈</span>
          <span>Historikk</span>
        </button>
        <button class="bottom-nav__item" data-route="#/innstillinger" type="button">
          <span class="bottom-nav__icon" aria-hidden="true">⚙️</span>
          <span>Innstillinger</span>
        </button>
      </nav>
    </div>

    <noscript>Pust krever JavaScript for å virke.</noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
